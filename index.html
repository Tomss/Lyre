    <!-- Instant Frame-0 Image Pre-Hydration & Prefetching -->
    <link rel="preload" as="image" href="/lyre-logo.png" fetchpriority="high">
    <link rel="preload" as="image" href="/hero-banner.webp" fetchpriority="high">
    <link rel="prefetch" as="image" href="/school-banner.webp">
    <link rel="prefetch" as="image" href="/orchestras-banner.webp">
    <link rel="prefetch" as="image" href="/media-banner.webp">
    <link rel="prefetch" as="image" href="/contact-banner.webp">
    <script>
      (function() {
        try {
          var c = localStorage.getItem('lyre_cached_carousel_v3');
          if (c) {
            var arr = JSON.parse(c);
            if (Array.isArray(arr) && arr.length > 0 && arr[0]) {
              var l = document.createElement('link');
              l.rel = 'preload';
              l.as = 'image';
              l.href = arr[0];
              l.fetchPriority = 'high';
              document.head.appendChild(l);
            }
          }
          var h = localStorage.getItem('lyre_cached_headers_v1');
          if (h) {
            var headers = JSON.parse(h);
            Object.values(headers).forEach(function(url) {
              if (url) {
                var l2 = document.createElement('link');
                l2.rel = 'prefetch';
                l2.as = 'image';
                l2.href = url;
                document.head.appendChild(l2);
              }
            });
          }
        } catch(e) {}
      })();
    </script>
